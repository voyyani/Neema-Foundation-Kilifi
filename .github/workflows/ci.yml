name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NF

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: NF/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Blocking — the build must compile. See docs/AUDIT.md section 3.1.
      - name: Type check
        run: npx tsc -b

      # Non-blocking ceiling. Lower LINT_MAX as debt is paid down; never raise it.
      - name: Lint (capped)
        env:
          LINT_MAX: '254'
        run: |
          npx eslint . -f json > /tmp/eslint.json 2>/dev/null || true
          count=$(node -e "const r=require('/tmp/eslint.json');console.log(r.reduce((n,f)=>n+f.errorCount,0))")
          echo "ESLint errors: $count (ceiling: $LINT_MAX)"
          if [ "$count" -gt "$LINT_MAX" ]; then
            echo "::error::Lint errors increased to $count (ceiling $LINT_MAX)."
            exit 1
          fi

      - name: Build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
        run: npx vite build

      # Guards the Phase 1 bundle work against regression. See docs/AUDIT.md section 5.1.
      - name: Bundle size budget
        env:
          MAX_ENTRY_KB: '1100'
        run: |
          entry=$(find dist/assets -name 'index-*.js' -printf '%s\n' | sort -rn | head -1)
          kb=$(( entry / 1024 ))
          echo "Entry chunk: ${kb} kB (budget: ${MAX_ENTRY_KB} kB)"
          if [ "$kb" -gt "$MAX_ENTRY_KB" ]; then
            echo "::error::Entry chunk grew to ${kb} kB (budget ${MAX_ENTRY_KB} kB)."
            exit 1
          fi
