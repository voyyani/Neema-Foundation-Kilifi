    <style>
      /* Critical CSS for initial load — token values from tailwind.config.js */
      body {

      /* Loading screen: a blank page with the red margin rule. */
      .loading-container {
        position: fixed;
        inset: 0;
        background: #FCFBF8;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      .loading-container::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 20px;
        width: 2px;
        background: #B01C2E;
      }
      @media (min-width: 1024px) {
        .loading-container::before { left: max(48px, calc((100vw - 1200px) / 2)); }
      }
      
      .loading-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
      }
      
      .loading-text {
        font-family: 'Archivo', 'Inter', sans-serif;
        font-variation-settings: 'wdth' 82;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #151A22;
        margin-bottom: 6px;
      }
      
      .loading-subtext {
        font-size: 14px;
        color: #5F6774;
        margin-bottom: 28px;
      }
      
      .loading-bar {
        width: 160px;
        height: 2px;
        background: #E3E0D9;
        overflow: hidden;
      }
      
      .loading-progress {
        height: 100%;
        width: 40%;
        background: #B01C2E;
        animation: loading 1.2s infinite cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
      
      @media (prefers-reduced-motion: reduce) {
        .loading-progress { animation: none; width: 100%; }
      }
      
      .fade-out {
        opacity: 0;
        pointer-events: none;
      }
    </style>

  <body>
    <!--
      impeccable direction contract · seed dbfc66cd · code-led
      THESIS: The site is a Kenyan school exercise book kept by the Foundation: ruled paper, a red margin rule, figures tallied on the classroom board. It refuses the charity template (full-bleed photo hero, three icon cards, urgency button).
      OWN-WORLD: Paper #FCFBF8 with blue feint rules at 30px; the maroon margin rail every element registers against; chalkboard bands #1B2622 with chalk type for figures and the ask; Archivo condensed caps for headings, Inter for reading; photographs placed as captioned plates; the teacher's tick and pen underline as the only ornament.
      STORY: A donor on a phone in Kilifi or abroad understands in one screen who this is (a registered CBO in Ganze since 2020), sees the work as figures and photographs, and gives by Paybill or bank with no doubt about what happens next.
      FIRST VIEWPORT (360px): nav on paper with logo left and a maroon Give button right; below, ruled paper with the rail: the headline in condensed caps at ~44px, one-sentence subtitle, primary Give + secondary See programmes, then the Ahoho Mission photograph as a plate with its caption; three tallies with unit, period and programme follow.
      FORM: Kenyan school exercise book & chalkboard, candidate 4 of 7 (assigned by roll dbfc66cd). Raises: structure is the only ornament (Coptic); every zone headed by its literal name (streetwear); one rail all matter registers against (emission rail); every figure carries unit, period and subject (six-pack); rules drawn real, not a texture (silkscreen).
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->

    <script>
      // Remove loading screen when app is ready
      window.addEventListener('load', function() {
        const loadingElement = document.getElementById('loading');
        if (loadingElement) {
          loadingElement.classList.add('fade-out');
          setTimeout(function() {
            loadingElement.remove();
          }, 300);
        }
      });

      // Fallback in case load event doesn't fire
      setTimeout(function() {
        const loadingElement = document.getElementById('loading');
        if (loadingElement && loadingElement.parentNode) {
          loadingElement.classList.add('fade-out');
          setTimeout(function() {
            if (loadingElement.parentNode) {
              loadingElement.remove();
            }
          }, 500);
        }
      }, 3000);
    </script>
